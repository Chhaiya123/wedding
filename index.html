<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>សិរីមង្គលអាពាហ៍ពិពាហ៍ យឿន ឆៃយ៉ា & ហែម សុខហ័រ</title>
    <link rel="stylesheet" href="./src/output.css">
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="stylesheet" href="./style.css">

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <style>
        button.nl-badge {
            opacity: 0 !important;
        }
        .nl-badge {
            opacity: 0 !important;
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex flex-col items-center justify-center p-1 sm:p-6 text-amber-100">

<nav  id="navbar" class="navbar-btn" data-aos="fade-up">
    <a id="home" class="nav-btn bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-red-950 font-bold px-5 py-2.5 rounded-full shadow-lg transition transform hover:scale-102 battambang-font text-xs sm:text-sm w-full sm:w-auto" href="/">
        សូមគោរពអញ្ចើញ
    </a>
    <a id="about" class="nav-btn bg-red-900/80 hover:bg-red-800 text-amber-200 border border-amber-400/50 font-semibold px-4 py-2.5 rounded-full shadow transition transform hover:scale-102 battambang-font text-xs sm:text-sm w-full sm:w-auto" href="/about">
        សិរីមង្គលអាពាហ៍ពិពាហ៍
    </a>
</nav>


    <div id="app"></div>

    <script type="module" src="./js/app.js"></script>

    <script>
        AOS.init({
            duration: 1000,
            once: true
        });

        const homeUrl = localStorage.getItem("home");
        document.getElementById("home").href = homeUrl;

        const navbar = document.getElementById("navbar");

        let lastScrollY = window.scrollY;

        window.addEventListener("scroll", () => {
            const currentScrollY = window.scrollY;

            // Scroll < 50px
            if (currentScrollY < 50) {
                navbar.classList.remove("fixed", "hide");
            }
            // Scroll > 100px
            if (currentScrollY > 50) {

                // Scroll down
                if (currentScrollY > lastScrollY) {
                    navbar.classList.remove("hide");
                    navbar.classList.add("fixed");
                }

                // Scroll up
                if (currentScrollY < lastScrollY) {
                    navbar.classList.add("hide");
                }

            } else {
                // នៅជិតខាងលើ → បង្ហាញ Navbar
                navbar.classList.remove("hide");
            }

            lastScrollY = currentScrollY;
        });
    </script>

</body>
</html>
